name: Issue Automation

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  set-issue-metadata:
    runs-on: ubuntu-latest

    steps:
      - name: Add Under review Label
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Under review']
            });

            console.log('Added Under review label');

      - name: Set Issue Type
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label => label.name);

            let issueTypeName = null;

            if (labels.includes('bug')) {
              issueTypeName = 'Bug';
            } else if (labels.includes('enhancement')) {
              issueTypeName = 'Feature';
            }

            if (!issueTypeName) {
              console.log('No matching issue type label found.');
              return;
            }

            const query = `
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  issueTypes(first: 100) {
                    nodes {
                      id
                      name
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const issueType = result.repository.issueTypes.nodes.find(
              type => type.name === issueTypeName
            );

            if (!issueType) {
              core.setFailed(`Issue type "${issueTypeName}" not found.`);
              return;
            }

            const mutation = `
              mutation($issueId: ID!, $issueTypeId: ID!) {
                updateIssue(input: {
                  id: $issueId
                  issueTypeId: $issueTypeId
                }) {
                  issue {
                    issueType {
                      name
                    }
                  }
                }
              }
            `;

            const updated = await github.graphql(mutation, {
              issueId: issue.node_id,
              issueTypeId: issueType.id
            });

            console.log(
              `Issue #${issue.number} assigned to type: ${updated.updateIssue.issue.issueType.name}`
            );

      - name: Set Milestone
        if: github.event.action == 'labeled' && github.event.label.name == 'Accepted'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const milestone = milestones.find(m => m.title === 'v1.1.2');

            if (!milestone) {
              core.setFailed('Milestone v1.1.2 not found');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              milestone: milestone.number
            });

            console.log(
              `Issue #${context.issue.number} assigned to milestone v1.1.2`
            );