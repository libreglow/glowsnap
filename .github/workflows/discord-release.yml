name: Discord Release

on:
  release:
    types: [published]

jobs:
  discord:
    runs-on: ubuntu-latest
    environment: DISCORD_WEBHOOK
    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            MENTION="<@1533442543008747571>"
            COLOR=5793266
            TYPE="Stable"
          else
            MENTION="<@1533506422854389862>"
            COLOR=16776960
            TYPE="Pre-release"
          fi

          jq -n \
            --arg mention "$MENTION" \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg body "$RELEASE_BODY" \
            --arg type "$TYPE" \
            --argjson color "$COLOR" \
            '{
              content: $mention,
              username: "LibreGlow Releases",
              embeds: [{
                title: ("🚀 " + $name),
                url: $url,
                description: $body,
                color: $color,
                fields: [
                  {
                    name: "Version",
                    value: ("`" + $tag + "`"),
                    inline: true
                  },
                  {
                    name: "Type",
                    value: $type,
                    inline: true
                  }
                ],
                footer: {
                  text: "LibreGlow • GitHub Releases"
                }
              }]
            }' > payload.json

          curl \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK"