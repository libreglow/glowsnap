name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: DISCORD_WEBHOOK

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: ./scripts/install-deps.sh --install

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Determine release channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *"-alpha"*)   channel="alpha" ;;
            *"-beta"*)    channel="beta" ;;
            *"-nightly"*) channel="nightly" ;;
            *)            channel="stable" ;;
          esac

          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Prepare release (build + collect artifacts)
        run: ./scripts/release.sh "${GITHUB_REF_NAME}" "${{ steps.channel.outputs.channel }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.channel.outputs.channel != 'stable' }}
          files: |
            release/*/GlowSnap-*-x86_64.AppImage
            release/*/glowsnap-*-linux-amd64
            release/*/SHA256SUMS

      - name: Send release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          RELEASE=$(gh api \
            "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")

          RELEASE_NAME=$(echo "$RELEASE" | jq -r '.name')
          RELEASE_URL=$(echo "$RELEASE" | jq -r '.html_url')
          RELEASE_BODY=$(echo "$RELEASE" | jq -r '.body // ""')

          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            MENTION="<@1533442543008747571>"
            COLOR=5793266
            TYPE="Stable"
          else
            MENTION="<@1533506422854389862>"
            COLOR=16776960
            TYPE="Pre-release"
          fi

          jq -n \
            --arg mention "$MENTION" \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg body "$RELEASE_BODY" \
            --arg type "$TYPE" \
            --argjson color "$COLOR" \
            '{
              content: $mention,
              username: "LibreGlow Releases",
              embeds: [{
                title: ("🚀 " + $name),
                url: $url,
                description: $body,
                color: $color,
                fields: [
                  {
                    name: "Version",
                    value: ("`" + $tag + "`"),
                    inline: true
                  },
                  {
                    name: "Type",
                    value: $type,
                    inline: true
                  }
                ],
                footer: {
                  text: "LibreGlow • GitHub Releases"
                }
              }]
            }' |
            curl \
              -H "Content-Type: application/json" \
              -d @- \
              "$DISCORD_WEBHOOK"

